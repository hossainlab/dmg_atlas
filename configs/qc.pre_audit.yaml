# Phase 2 QC thresholds for the DMG atlas (applied per sample; cells are flagged, never removed here).
# assay_class is resolved from manifest.assay: nuclei = {snRNA, multiome_RNA}; cells = {scRNA}; smartseq2 = {smartseq2}.
# Collot/ScPCA/Okada/Jessa-snRNA are nuclei; DeSisto/Zang/Jessa-scRNA/LaBelle-10x are whole cells.
mito_gene_prefix: "MT-"
ribo_gene_prefixes: ["RPS", "RPL"]
hb_gene_regex: "^HB[ABDEGMQZ]\\d?$"   # haemoglobin genes (HBA1/2, HBB, HBD, HBE1, HBG1/2, HBM, HBQ1, HBZ); excludes HBP1/HBS1L/HBEGF
thresholds:
  nuclei:
    pct_mito_max: 5.0
    min_genes: 300
  cells:
    pct_mito_max: 20.0
    min_genes: 300
  smartseq2:
    pct_mito_max: 20.0
    min_genes: 1000
# per-sample upper bound on detected genes: cells above this quantile of n_genes within the sample fail QC
max_genes_quantile: 0.995
# scrublet (per 10x sample with UMI counts; TPM cohorts are skipped; samples below min_cells are skipped)
scrublet:
  expected_doublet_rate: 0.06
  min_cells: 100
  random_state: 0
  n_hvg: 3000          # genes pre-selected (seurat_v3 on counts) before scrublet; memory guard, scrublet re-filters internally
  fixed_threshold: 0.25  # used when the automatic threshold fails; also stored as predicted_doublet_fixed for every sample
  flag_only: true   # doublets are flagged (predicted_doublet) but NOT removed in Phase 2
